<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8FB9A8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Catatan Keuangan">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"><title>Catatan Keuangan</title>
</head><body><div id="app">
<header class="topbar"><div><div class="brand"><span class="brand-icon"><img src="header-mascot.png" alt=""></span><span id="appTitle">Pelan tapi pasti 🌱</span></div><div class="subtitle" id="today"></div></div><button class="note-top-btn" id="noteBtn" aria-label="Note" title="Note"><img src="note.png" class="action-img" alt=""></button></header>
<main>
<section class="hero-card"><div class="hero-head"><div><div class="muted" id="mainBalanceLabel">Total saldo</div><div class="balance" id="mainBalance">Rp0</div></div><button class="eye-btn" id="hideBalanceBtn"><img src="eye.png" class="action-img" alt=""></button></div><div class="hero-row"><div><span id="incomeLabel">Pemasukan</span><strong id="income">Rp0</strong></div><div><span id="expenseLabel">Pengeluaran</span><strong id="expense">Rp0</strong></div></div></section>
<section class="accounts-section"><div class="section-title"><h2 id="accountsTitle">Akun</h2><button class="small-add" id="addAccountBtn"><img src="plus.png" class="button-img" alt=""></button></div><div class="account-scroller" id="accountList"></div></section>
<section class="calendar-card"><div class="section-title"><h2 id="calendarTitle">Kalender</h2></div><div class="calendar-controls"><button class="cal-nav" id="prevMonth"><img src="arrow-left.png" class="button-img" alt=""></button><strong id="calendarMonthLabel"></strong><button class="cal-nav" id="nextMonth"><img src="arrow-right.png" class="button-img" alt=""></button></div><div class="calendar-weekdays" id="calendarWeekdays"></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-filters" id="calendarFilters"><div class="filter-field"><label id="filterAmountLabel">Nominal</label><input id="calendarAmountFilter" type="text" inputmode="numeric" autocomplete="off" placeholder="Cari nominal"></div><div class="filter-field"><label id="filterCategoryLabel">Kategori</label><div id="calendarCategoryFilter"></div></div></div><div class="selected-date-label" id="selectedDateLabel"></div><div id="selectedDateTx"></div><div class="all-transactions-head"><button type="button" class="all-transactions-button" id="openAllTransactions"><img src="transactions.png" alt="" class="history-button-icon"><span class="history-button-copy"><strong id="allTransactionsTitle">Lihat Semua Transaksi</strong><small id="allTransactionsSubtitle">Buka riwayat transaksi lengkap</small></span><img src="arrow-right.png" alt="" class="history-button-arrow"></button></div></section>
<section class="analytics-card"><div class="section-title"><h2 id="chartTitle">Ringkasan pengeluaran</h2></div><div id="expenseChart"></div></section>
<section class="recurring-card"><div class="section-title"><h2 id="recurringTitle">Pengeluaran tetap per bulan</h2><button class="small-add" id="addRecurringBtn"><img src="plus.png" class="button-img" alt=""></button></div><div id="recurringList"></div></section>
<section class="planning-card"><div class="section-title"><h2 id="budgetTitle">Budget Bulanan</h2><button class="small-add" id="editBudgetBtn"><img src="edit.png" class="button-img" alt=""></button></div><div id="budgetCard"></div></section>
<section class="planning-card"><div class="section-title"><h2 id="savingsTitle">Target Tabungan</h2><button class="small-add" id="editSavingsBtn"><img src="plus.png" class="button-img" alt=""></button></div><div id="savingsCard"></div></section>

</main>
<section class="history-screen" id="historyScreen" aria-hidden="true">
  <header class="history-header"><button type="button" id="closeAllTransactions" class="history-back" aria-label="Kembali"><img src="arrow-left.png" alt=""></button><h2 id="historyTitle">Semua Transaksi</h2><span class="history-header-mascot"><img src="header-mascot.png" alt=""></span></header>
  <div class="history-content">
    <label class="history-search"><img src="transactions.png" alt=""><input id="historySearch" type="search" autocomplete="off" placeholder="Cari kategori, catatan, nominal..."></label>
    <div class="history-filter-card"><label for="historyAccountFilter" id="historyAccountLabel">Filter akun</label><select id="historyAccountFilter"><option value="">Semua akun</option></select><div class="history-type-filters" id="historyTypeFilters"><button type="button" class="active" data-history-type="all">Semua</button><button type="button" data-history-type="expense">Pengeluaran</button><button type="button" data-history-type="income">Pemasukan</button><button type="button" data-history-type="transfer">Transfer</button></div></div>
    <div id="historyTransactionList"></div>
  </div>
</section>
<nav class="bottom-nav"><button class="nav active" data-tab="home"><img src="home.png" class="nav-img" alt=""><span id="navHome">Beranda</span></button><button class="nav" data-tab="transactions"><img src="transactions.png" class="nav-img" alt=""><span id="navTransactions">Transaksi</span></button><button class="fab" id="fab"><img src="fab-plus.png" class="fab-img" alt=""></button><button class="nav" data-tab="categories"><img src="categories.png" class="nav-img" alt=""><span id="navCategories">Kategori</span></button><button class="nav" data-tab="settings"><img src="settings.png" class="nav-img" alt=""><span id="navSettings">Pengaturan</span></button></nav>
</div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="closeModal"><img src="close.png" class="button-img" alt=""></button></div><div id="modalBody"></div></div></div><script src="app.js"></script></body></html>
